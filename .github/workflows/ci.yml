name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: benchmarker
          POSTGRES_PASSWORD: benchmarker_secret
          POSTGRES_DB: llm_benchmark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benchmarker -d llm_benchmark_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://benchmarker:benchmarker_secret@localhost:5432/llm_benchmark_test
      JWT_SECRET_KEY: ci-test-jwt-secret

    steps:
      - uses: actions/checkout@v6

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend (tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Syntax check & import backend
        run: |
          python -m compileall -q backend/app
          python -c "from backend.app.main import app; print('FastAPI app loaded:', app.title)"
